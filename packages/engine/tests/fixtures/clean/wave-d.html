    <tr><th scope="col">Header</th><td>Data</td></tr>

    <tr><th>Name</th><th>Value</th></tr>

  </table>

  <!-- list-item inside ul -->
  <ul>
    <li>Proper item</li>
  </ul>

  <!-- style without aria -->
  <style></style>
