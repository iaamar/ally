<!DOCTYPE html>
<html lang="en">
<head><title>Clean Page</title></head>
<body>
  <div>
    <!-- Valid role -->
    <div role="button">Click</div>
    <!-- Valid aria prop -->
    <div aria-expanded="true">Toggle</div>
    <!-- aria-hidden on non-focusable -->
    <div aria-hidden="true">Hidden</div>
    <!-- Non-redundant role -->
    <button role="link">Navigate</button>
    <nav>Nav</nav>
    <!-- Form control with label -->
    <label for="name">Name</label>
    <input type="text" id="name" />
    <!-- Form control with aria-label -->
    <input type="search" aria-label="Search" />
    <!-- Heading with content -->
    <h1>Welcome</h1>
    <!-- Unique ids -->
    <div id="unique1">First</div>
    <div id="unique2">Second</div>
  </div>
</body>
</html>
